[project]
name = "blogapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "purrya", email = "tikhonenko_ad@vl.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "dj-rest-auth>=7.0.1",
    "django>=6.1.1",
    "django-allauth>=65.19.4",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "environs>=15.2.0",
    "gunicorn[binary]>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "requests>=2.32.3",
    "ruff>=0.16.8",
    "whitenoise>=6.12.0",
]

[project.scripts]
blogapi = "blogapi:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
# Django migrations are auto-generated; don't lint/format them.
extend-exclude = ["*/migrations/*"]
